<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For My Babon ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
overflow:hidden;
}

.container{
text-align:center;
}

.envelope{
font-size:120px;
cursor:pointer;
animation:bounce 1.3s infinite;
}

.tap{
font-size:22px;
color:white;
margin-top:15px;
font-weight:bold;
text-shadow:2px 2px 5px black;
}

.card{
display:none;
background:white;
padding:35px;
border-radius:25px;
width:90%;
max-width:380px;
box-shadow:0 15px 35px rgba(0,0,0,.25);
animation:fade 1s;
}

h1{
color:#ff3366;
margin-bottom:15px;
}

#typing{
font-size:22px;
line-height:1.6;
min-height:150px;
color:#444;
}

button{
margin-top:25px;
padding:12px 28px;
border:none;
background:#ff3366;
color:white;
font-size:20px;
border-radius:30px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.heart{
position:absolute;
font-size:22px;
animation:float 5s linear forwards;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

@keyframes bounce{
50%{
transform:translateY(-15px);
}
}

@keyframes fade{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}

</style>
</head>

<body>

<div class="container">

<div id="start">

<div class="envelope">💌</div>

<div class="tap">
Tap to Open My Heart ❤️
</div>

</div>

<div class="card" id="card">

<h1>Heyy Babon 💖🥺</h1>

<p id="typing"></p>

<button onclick="love()">
I Love You ❤️
</button>

</div>

</div>

<!-- Romantic Piano Music -->
<audio id="music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>

const text="I am missing u sooo much... 💖\n\nEvery little thing reminds me of you.\n\nI wish I could hug you right now... 🥺❤️\n\nPlease smile today because someone is thinking about you every second. 🌹";

let i=0;

document.getElementById("start").onclick=function(){

document.getElementById("start").style.display="none";

document.getElementById("card").style.display="block";

document.getElementById("music").play();

typing();

setInterval(floatingHeart,250);

}

function typing(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(typing,55);

}

}

function floatingHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=["❤️","💖","💕","💗"][Math.floor(Math.random()*4)];

heart.style.left=Math.random()*100+"vw";

heart.style.top="100vh";

heart.style.fontSize=(20+Math.random()*25)+"px";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),5000);

}

function love(){

alert("Forever Yours ❤️🥺");

}

</script>

</body>
</html>
